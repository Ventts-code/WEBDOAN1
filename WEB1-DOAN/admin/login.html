<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | Đăng nhập hệ thống</title>
  <link rel="icon" type="image/png" href="../images/logo-cat.png">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="login-page-body">
  <div class="login-backdrop-decor"></div>

  <div class="login-card">
    <div class="login-brand-header">
      <div class="login-logo-box">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1 class="login-title">Hệ Thống Quản Trị</h1>
      <p class="login-subtitle">Đăng nhập để quản lý người dùng, sản phẩm & đơn hàng</p>
    </div>

    <form class="login-form" id="loginForm" action="index.html" method="get">
      <div class="form-group">
        <label class="form-label" for="loginEmail">Tài khoản / Email</label>
        <div class="login-input-wrap">
          <svg class="login-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" />
          </svg>
          <input type="text" id="loginEmail" placeholder="Nhập tài khoản hoặc email" value="admin@store.vn" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Mật khẩu</label>
        <div class="login-input-wrap">
          <svg class="login-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
          <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" value="Admin@2026" required>
        </div>
      </div>

      <div class="login-meta">
        <label class="login-checkbox">
          <input type="checkbox" id="rememberMe" checked>
          <span>Ghi nhớ đăng nhập</span>
        </label>
        <a href="../index.html" class="login-forgot-link" style="color: #38bdf8;">&larr; Về Cửa Hàng</a>
      </div>

      <button type="submit" class="btn-login-submit" id="submitBtn">
        <span>Đăng nhập hệ thống</span>
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>

      <div class="login-demo-helper">
        <div style="text-align:center; margin-top:1px;">
          <a href="../index.html" style="color:var(--primary); font-size:15px; text-decoration:none;">&larr; Quay lại trang chủ ShopCloth</a>
        </div>
      </div>
    </form>
  </div>

</body>
</html>
